[book]
title = "Async Rust：从 Future 到生产实践"
authors = ["Rust Training Team"]
language = "zh-CN"
src = "src-zh"

[build]
build-dir = "book-zh"

[output.html]
git-repository-url = "https://github.com/microsoft/RustTraining"
default-theme = "light"
preferred-dark-theme = "ayu"
additional-css = ["language-switcher.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "language-switcher.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.playground]
editable = true
line-numbers = true
